patterns:
  - description: "A seeded draw applied along an unseeded axis is not seeded. Determinism is a property of a pipeline, not of its components — audit the ordering, not only the RNG."
    context: "determinism,seed,ordering,rng,pipeline"
    type: technical
  - description: "A gate allowed to stay red stops being a gate. Parking a failure without pinning it destroys the signal, and the real defect is the second one that entered while the gate was dark."
    context: "ci,gate,lint,parked,signal"
    type: process
  - description: "Tests that observe a proxy for the outcome rather than the outcome: a gate nobody runs, a loop asserting nothing when empty, a feature tested only up to persistence, a codepath behind an optional field, components seeded but composition not."
    context: "testing,vacuous,coverage,proxy"
    type: process
  - description: "Verify the verifier: rai gate check exits 0 while printing FAILED: 5 of 15 gates failed, and rai pattern add reports success while writing nothing."
    context: "tooling,raise,gate,verification"
    type: process
  - description: "When a defect is a pattern rather than a typo, fixing the first occurrence is how you find the second. Re-run the failing test after each fix and expect it to still fail."
    context: "debugging,pattern,rca"
    type: process
corrections:
  - what: "Wrote acceptance criteria before reading the implementation, twice in one session"
    lesson: "s7.4's story artifact had three wrong API contracts and BUG-04's criterion 3 asserted against the generator's design — satisfying it would have broken the feature. The design phase's gemba walk is where criteria get re-verified, not merely elaborated."
  - what: "Nearly shipped an E2E test that could only ever observe failure"
    lesson: "An assertion permitting two outcomes (201 or 502) verifies neither until you confirm which one occurs. A stub that always fails proves degradation, not function."
