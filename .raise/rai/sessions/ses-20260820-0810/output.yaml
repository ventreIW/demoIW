narrative: |
  ## Decisions
  - Ran the full RaiSE ceremony for every unit: 5 complete bugfix pipelines (start→triage→
    analyse→plan→fix→review→close) and the full story lifecycle for s7.4, per
    raise-framework-fidelity.
  - Merged locally with --no-ff rather than pushing/PRs, on Rodrigo's explicit choice.
  - BUG-05 fixed via ADR-011 (stable ordinal column) over two rejected alternatives: honouring
    the domain id collides on the client primary key for same-seed regeneration, and order-free
    labelling would invalidate ADR-006/007's measured ROC-AUC figures.
  - E6 closed with M4's Postgres item open, on Rodrigo's explicit decision rather than omission.
  - BUG-03 stopped at partial rather than forcing a green test — the residual is architectural
    and became BUG-06, held as a strict xfail so the criterion is recorded, not dropped.

  ## Research
  - BUG-05 root cause found by staged bisection: generator reproducible (ids/patterns/names
    identical), scoring reproducible given fixed data, split sorted, estimator lbfgs — leaving
    identity. sqlalchemy_client_repo.py:39 overwrites the generator's id with uuid4();
    intersection between generator ids and persisted ids measured at 0 of 100.
  - Fixing OutcomeLabeller did not make the test pass: BuildTrainingSet held the identical
    shape one stage later, invisible until the first was fixed.
  - NFR-02 never needed Postgres — s6.2's deferral inherited a neighbouring blocker.
  - No test in this project has ever run an Alembic migration (conftest uses create_all).

  ## Artifacts
  - work/bugs/BUG-01..BUG-05/ — scope, analysis, plan, retro for each
  - dev/decisions/adr-011-scoring-reproducibility.md
  - backend/alembic/versions/0004_client_generation_index.py
  - backend/tests/test_e2e_demo_flow.py, test_nfr02_performance.py,
    test_scoring_reproducibility.py, test_reference_date_pinning.py
  - work/epics/e6-executive-panel/retrospective.md, e7-demo-readiness/retrospective.md
  - work/epics/e7-demo-readiness/stories/s7.4-{story,scope,design,plan,progress,retrospective}.md
  - dev/parking-lot.md — 4 resolutions marked, 5 new items filed

  ## Branch State
  - main, tree clean, 63 commits ahead of origin/main, tags epic/e6-complete and
    epic/e7-complete added.
  - Backend 558 passed / 3 skipped / 1 xfailed, ruff + mypy clean.
  - Frontend typecheck, lint, 207 tests, npm run build all green.
next_session_prompt: |
  Every planned story across E1–E7 is delivered and both remaining epics are closed and tagged.
  There is no story work left. Two things are waiting on Rodrigo, not on you:

  1. PostgreSQL. It is the last open gate (E6 M4) and the only reason E6 closed incomplete.
     Ask him to run `sudo apt install -y postgresql && sudo service postgresql start` plus the
     demoiw_test database, then run:
       DEMOIW_TEST_POSTGRES_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/demoiw_test \
       .venv/bin/pytest tests/test_e2e_demo_flow.py -k postgres -v
     Expect real findings — migration 0004 has never executed against any database, and no test
     in this project has ever run Alembic at all.

  2. main is 63 commits ahead of origin and has had no CI since 2026-08-15. When he pushes,
     watch the run; the frontend job now includes npm run build, which is new.

  Do NOT trust `rai gate check` — it exits 0 while reporting failures. Use direct commands.
  `rai pattern add` writes nothing, so anything worth keeping must go into a markdown artifact
  or into memory by hand.

  The next substantive piece of work is an ADR for BUG-06: a CSV upload carries no payment
  history, so per-scenario supervised training cannot work on it. Deriving the pattern from
  ageing is the leakage ADR-006 forbids; randomising it trains a confident model on noise. The
  real question is whether uploads should be scored by a pre-trained model instead.
