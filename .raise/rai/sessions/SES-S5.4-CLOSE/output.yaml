patterns:
  - description: "Shared case aggregate service — Extract fetch_case_aggregate() to a service used by both router and use cases. Single source of truth for composed data."
    context: "case-aggregate, shared-service, router-use-case-reuse, s5.4"
    type: process
  - description: "LLM prompt as config file — Store prompts in prompts/{domain}/v{N}_name.txt, load at service init. Enables iteration without code changes."
    context: "llm-prompt-config, config-driven, s5.4"
    type: technical
  - description: "500-after-retries → 502 pattern — Catch ExternalServiceError in router and return 502. LLM adapter handles retries internally (MAX_RETRIES=3)."
    context: "llm-error-handling, 502-bad-gateway, external-service-error, s4.8, s5.4"
    type: process
corrections:
  - what: "OpenRouterAdapter retry logic testing with respx TimeoutException"
    lesson: "respx wraps TimeoutException in SideEffectError which bypasses adapter's retry logic. Documented limitation in integration tests."
  - what: "JSONDecodeError not caught by OpenRouterAdapter"
    lesson: "Adapter only catches HTTPStatusError and TimeoutException. Malformed JSON propagates as 500. Pre-existing gap, not introduced here."
  - what: "Frontend missing dependencies (next-intl, sonner, lucide-react)"
    lesson: "Pre-existing frontend issues not related to this story. Backend fully functional."
