narrative: |
  ## Decisions
  - Extracted shared fetch_case_aggregate() to case_aggregate_service.py — eliminates ~40 lines duplicate logic between router and use case
  - Config-driven prompt template in prompts/communications/v1_draft.txt following data_enrichment pattern
  - ExternalServiceError caught in router → 502 Bad Gateway, matching s4.8 pattern
  - Container provider ordering follows PAT-N-4: get_draft_service before get_generate_communication_draft_use_case

  ## Research
  - Verified OpenRouterAdapter retry behavior: 3 retries on 5xx/timeout, then ExternalServiceError
  - respx SideEffectError limitation for timeout testing documented in integration tests
  - JSONDecodeError not caught by adapter → 500 (pre-existing, not introduced)

