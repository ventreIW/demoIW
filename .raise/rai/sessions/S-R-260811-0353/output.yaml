patterns:
  - description: "Un stub devuelve lo que se le entregó, así que ninguna suite con stubs detecta que la FORMA de salida del modelo real es incorrecta. Los 541 tests de s6.3 pasaban mientras el modelo de razonamiento devolvía su cadena de pensamiento como narrativa visible al usuario. Donde la forma importa, hacer la conformidad verificable con un delimitador que el código extrae, no con una regla que el prompt enuncia — y presupuestar una llamada real para MIRAR la salida antes de dar por terminada una función LLM."
    context: "llm,prompts,verification,reasoning-models,testing"
    type: technical
  - description: "Hacer que la propiedad de seguridad sea estructural, no procedimental: restringir la salida del LLM a un modelo Pydantic cuyos campos son enums, de modo que no exista una comprobación de allow-list que alguien pueda olvidar — los tipos SON el allow-list. Combinar con extra='forbid' para que una clave inesperada (p. ej. 'sql') se rechace en vez de descartarse en silencio."
    context: "llm,security,pydantic,prompt-injection,adr-008"
    type: architecture
  - description: "Verificar que los comandos de verificación de un plan pueden ejecutarse ANTES de aprobar el plan. rai gate check debe correrse desde la raíz del repo con --scope relativo a backend/; desde backend/ imprime 'No .raise/manifest.yaml found' y SALE CON 0, así que un gate roto es indistinguible de uno que pasa."
    context: "raise,gates,tooling,verification,demoiw"
    type: process
  - description: "Probar el ORDEN de una llamada costosa con un stub que LANZA si se invoca, no afirmando call_count == 0 después. Una aserción de conteo pasa incluso si la llamada ocurrió y la excepción se tragó. Instalar el stub explosivo solo alrededor del camino bajo prueba — durante el setup, otro código usa legítimamente el mismo puerto."
    context: "testing,stubs,ordering,quota,llm"
    type: process
corrections:
  - what: "Commiteé T3 con un error de tipos vivo porque la cadena de verificación era 'rai gate check gate-types | tail -2 && git commit' — el && leyó el exit code de tail, no el del gate."
    lesson: "Nunca canalizar un gate a tail dentro de una cadena &&. Comprobar el exit code que realmente se quiere. Irónico: esta misma sesión documentó la misma clase de éxito silencioso en el propio runner de gates una hora antes."
  - what: "La primera llamada en vivo llegó en T6 en lugar de T4."
    lesson: "T6 es el lugar correcto para la verificación como puerta de merge, pero una sola llamada desechable en T4 —solo para MIRAR lo que emite el modelo— habría capturado la forma de salida del modelo de razonamiento antes de quedar horneada en un prompt, un caso de uso y dos archivos de test. Coste de moverla: una petición."
  - what: "s6.3-scope.md se escribió con una ruta inexistente (backend/prompts/ en vez de prompts/)."
    lesson: "El gemba del diseño lo capturó, pero el scope se había escrito sin comprobar que el directorio existiera. Verificar rutas contra el disco al redactar scope, no al diseñar."
