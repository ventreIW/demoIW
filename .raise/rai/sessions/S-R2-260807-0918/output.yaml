narrative: |
  ## Decisions
  - Split state handling at the page (server) vs dashboard (client): page owns error / 409-unscored /
    no-active branches (ADR-009 zeros are a failure mode), dashboard composes given kpis. Matches
    design.md D1 and the existing cases/page.tsx pattern.
  - 4 KPI cards per AC1: total overdue, expected recoverable, cases by category (sub-label shows
    High/Med/Low), recovery rate (actual value, expected as sub-label) — covers all five KPI labels
    without exceeding the 4-card layout.
  - Sidebar executive link built from useLocale() -> /{locale}/executive, matching the established
    /{locale}/cases link convention rather than deriving a locale from usePathname (design D6).
  - No new charting dependency: hand-rolled CSS bar charts per E6 scope (D3).
  ## Research
  - Confirmed active-scenario contract: active_scenario_id cookie read server-side via next/headers
    cookies(); fetchKpis throws typed PortfolioNotScoredError (409) / ScenarioNotFoundError (404).
  - Env fact: backend is Postgres-only (asyncpg, postgresql+asyncpg://...:5432/demoiw, Postgres-specific
    alembic migrations); no Postgres/Docker on this WSL host => live E2E not runnable here.
  ## Artifacts
  - frontend/src/components/executive/{KpiCard,SegmentationChart,ExecutiveDashboard}.tsx + tests
  - frontend/src/app/[locale]/executive/page.tsx + __tests__/page.test.tsx
  - frontend/src/lib/api/executive.ts, frontend/src/types/executive.ts (T1, prior commit)
  - frontend/src/test-utils/kpis-fixture.ts
  - frontend/src/components/layout/MainLayout.tsx (sidebar link)
  - messages/es.json, messages/en.json (+loading, +noActiveScenario keys)
  - work/epics/e6-executive-panel/stories/s6.2-plan.md (duration tracking updated)
  ## Branch State
  - Branch story/s6.2/kpi-dashboard-segmentation; commits this session: a717c42 (T3),
    c297fd3 (T4), 346e024 (T5). Full suite green.
