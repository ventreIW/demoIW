narrative: |
  ## Decisions
  - Took all remaining decisions under explicit delegation ("take the decisions yourself").
  - ADR-012 accepted as Option B, reversing my own earlier recommendation after reading RF-07.
  - Tagged v1.0.0 after verifying the vision's five measurable outcomes against observable
    state rather than the epic tracker.
  - Amended migration 0005 rather than superseding it (no database had applied it); added
    0006 forward rather than amending 0002 (which may have been applied elsewhere).

  ## Research
  - PostgreSQL runs in userspace via the `pgserver` PyPI package — no root, no Docker. This
    is what finally closed M4 after six deferrals.
  - The backend venv had no pip; `python -m ensurepip --upgrade` bootstrapped it.
  - TSU-DSM: the published perfil de egreso is prose, not a numbered list of six. Grounded the
    coverage map in it with four sources; the grouping remains a reading, not a citation.

  ## Artifacts
  - work/bugs/BUG-06..BUG-09/, dev/decisions/adr-012, migrations 0005 and 0006
  - backend/tests/: test_nfr06_auditability.py, test_schema_agreement.py
  - docs/project-completion.md, docs/tsu-dsm-competency-coverage.md
  - .github/workflows/ci.yml: format gates both stacks + backend-postgres job

  ## Branch State
  - main, clean, pushed. Tags epic/e1..e7-complete and v1.0.0.
  - 571 backend tests with PostgreSQL (563 + 8 skipped without), 207 frontend. All three CI
    jobs green.

  ## Environment changes worth knowing
  - `pip` was bootstrapped into `backend/.venv` via ensurepip. It was absent (uv-created
    venv); this is standard venv furniture and is not in requirements.
  - A scratch PostgreSQL lived in the session scratchpad and has been shut down cleanly.
next_session_prompt: |
  demoIW is tagged v1.0.0 and complete. All 7 epics closed and tagged, all 7 functional and
  all 6 non-functional requirements delivered and tested, three CI jobs green including the
  full path against real PostgreSQL. There is no outstanding development work.

  If work resumes, the two things waiting on people are: Renata or Gustavo confirming the six
  TSU-DSM competency components (docs/tsu-dsm-competency-coverage.md groups the published
  profile's prose into six, which is a reading and not a citation), and Gustavo on the
  standing policy questions — the one that matters is that no collections practitioner has
  read the Spanish copy, which now includes LLM-generated director-facing narratives.

  If you need PostgreSQL again: it runs in userspace via `pgserver`, no root required. Hold it
  open in a background process, point DEMOIW_TEST_POSTGRES_URL at the unix socket. This is how
  M4 was finally closed after six deferrals that each repeated "no Postgres" without checking.

  Do NOT trust `rai gate check` — it exits 0 while reporting failures. `rai pattern add` and
  `rai session close` both report patterns written and write nothing, so anything worth
  keeping goes into markdown or memory by hand.

  ADR-012 was accepted under delegation rather than by the team; if Gustavo disagrees that
  uploaded scenarios should not be scorable, Option A is documented and ready to pick up.
