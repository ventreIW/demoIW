patterns:
  - description: "Re-test an inherited blocker before repeating it. 'No PostgreSQL available' was recorded on 2026-08-07 and cited across six deferrals without anyone re-examining it; a userspace PostgreSQL was one pip install away and took four minutes."
    context: "blocker,deferral,verification,assumptions"
    type: process
  - description: "Applying a migration is not using it. alembic upgrade head succeeded throughout while the ORM and the migrations declared the schema differently — they meet only on write, so a suite that builds its schema from the ORM can never see the difference."
    context: "migrations,orm,schema,testing"
    type: technical
  - description: "A test environment weaker than production makes a class of defect inexpressible rather than merely unobserved. No amount of review finds it, because both sides are correct in isolation."
    context: "testing,environment,sqlite,postgres"
    type: process
  - description: "After writing a guard, reintroduce the defect it exists for. My schema-agreement test keyed on type(column.type).__name__, so String(36) fell through an unmodelled-type branch and the reinjected BUG-09 divergence produced 5 passed."
    context: "testing,guard,verification,false-negative"
    type: process
  - description: "Decide from the requirement, not from the backlog. ADR-012 reversed from Option A to Option B on reading RF-07, which never mentions CSV upload — Option A would have built a pre-trained-model pipeline to satisfy a requirement nobody wrote."
    context: "adr,requirements,yagni,scope"
    type: architecture
corrections:
  - what: "Reported four stories as missing artifacts; two were false positives"
    lesson: "The audit scanned a stray duplicate directory (e1-stories/) and missed that s4.5-API shares its design with s4.5-formula by deliberate construction. Verify a gap before reporting it as one."
  - what: "Wrote a schema-agreement guard that did not catch the bug it was written for"
    lesson: "Writing the guard was not the work; proving it fails was. A silent skip branch is how it passed."
