patterns:
  - description: "Un test de filtro que sólo afirma status 200 — o que itera el resultado sin exigir que no esté vacío — no prueba nada y esconde un filtro muerto. Afirmar la relación de subconjunto: no vacío, estrictamente menor que sin filtrar, todo elemento cumple el predicado, y membresía exacta."
    context: "testing,api,filters,vacuous-assertions,test-muda"
    type: technical
  - description: "Cuando el fixture, el tipo y el componente se escriben de una sentada, pueden compartir la misma suposición equivocada y coincidir entre sí. Los tests mockeados pasan mientras producción se rompe. Fijar el fixture a un payload capturado del sistema corriendo y enumerar el conjunto real de valores del enum."
    context: "testing,contracts,fixtures,seam-bugs,integration"
    type: process
  - description: "Un guard de ruta que lee un estado que nadie escribe permanece invisible mientras la app tenga una sola ruta alcanzable. Añadir la segunda ruta es cuando dispara. Antes de añadir una ruta a una app con middleware, buscar quién escribe el estado que el middleware lee."
    context: "nextjs,middleware,routing,dead-code"
    type: codebase

