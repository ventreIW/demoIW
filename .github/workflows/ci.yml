name: CI

on:
  pull_request:
    branches:
      - main
  # Also gate direct pushes to main. Without this, commits that bypass a pull
  # request are never checked — which is how 112 lint violations and a leaking
  # test accumulated on main unnoticed (see PRs #1 and #2).
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # format:check is declared in .raise/manifest.yaml as format_command but was absent
      # here, so it was a gate nobody ran — 13 files drifted out of style unnoticed. Same
      # pathology as BUG-01 one layer down (BUG-07).
      - run: npm run format:check
      - run: npm test -- --run
      # E7's done-criterion is a production bundle (NFR-04, installable PWA), but nothing
      # here ever built one. Lint/typecheck/test were all green on 2026-08-05 while the
      # build was about to go red and stay red for 13 days (BUG-01). Build is the gate.
      - run: npm run build

  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/
      - run: pytest tests/ -v --tb=short

  # The SQLite suite above cannot express the defects BUG-09 was made of: it builds its schema
  # from the ORM via create_all, so the Alembic migrations never execute and the two
  # declarations never meet. That is how the backend shipped unable to write to its own
  # production database. This job is the only place they meet.
  backend-postgres:
    name: Backend on real PostgreSQL (E6 M4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demoiw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Full-path E2E + schema agreement against PostgreSQL
        env:
          DEMOIW_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/demoiw_test
        run: pytest tests/test_e2e_demo_flow.py tests/test_schema_agreement.py -v --tb=short
